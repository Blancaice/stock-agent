[project]
name = "a-share-research"
version = "0.1.0"
description = "基于 Fuyao/HiThink 的 A 股研究 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
fund-api = "fund_agent.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
