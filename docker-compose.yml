services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8003"
    depends_on:
      - redis

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
